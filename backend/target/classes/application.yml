server:
  port: 8080

spring:
  application:
    name: mr-field-force
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mr_system}
    username: ${DB_USERNAME:mr_app}
    password: ${DB_PASSWORD:mr_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
